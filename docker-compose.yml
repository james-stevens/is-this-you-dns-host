# Plain HTTP and DNS only. TLS is terminated by something in front of this
# service (see docker-compose.tls.yml). Do not add certificates here.

services:
  dns-host:
    build: .
    ports:
      - "8080:8080"
      - "5353:5353/udp"
      - "5353:5353/tcp"
    environment:
      SERVICE_NS: ${SERVICE_NS:-ns1.example.net.,ns2.example.net.}
      SECONDARIES: ${SECONDARIES:-}
      RESOLVER_BASE_URL: ${RESOLVER_BASE_URL:-https://api.web3dns.net/}
      CATALOG_ZONE: ${CATALOG_ZONE:-catalog.example.net.}
      CATALOG_RNAME: ${CATALOG_RNAME:-hostmaster.example.net.}
      DATA_DIR: /data
      HTTP_PORT: 8080
      DNS_PORT: 5353
      DNS_BIND: 0.0.0.0
      GUNICORN_BIND: 127.0.0.1:8000
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      TRUST_ANCHOR_FILE: /app/deploy/root-anchors.ds
      HANDSHAKE_ROOT_SERVERS: ${HANDSHAKE_ROOT_SERVERS:-}
      HANDSHAKE_TRUST_ANCHOR_FILE: ${HANDSHAKE_TRUST_ANCHOR_FILE:-}
      TSIG_KEY_NAME: ${TSIG_KEY_NAME:-}
      TSIG_SECRET: ${TSIG_SECRET:-}
      TSIG_ALGO: ${TSIG_ALGO:-hmac-sha256}
      AXFR_REQUIRE_TSIG: ${AXFR_REQUIRE_TSIG:-false}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-1048576}
      MAX_RRSETS: ${MAX_RRSETS:-2000}
      MAX_NAMES: ${MAX_NAMES:-1000}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-30}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      PARENT_QUERY_BUDGET: ${PARENT_QUERY_BUDGET:-15}
      PARENT_QUERY_WINDOW_SECONDS: ${PARENT_QUERY_WINDOW_SECONDS:-60}
      SERIAL_FUTURE_SECONDS: ${SERIAL_FUTURE_SECONDS:-300}
      SERIAL_PAST_SECONDS: ${SERIAL_PAST_SECONDS:-3600}
      RRSIG_MAX_LIFETIME_SECONDS: ${RRSIG_MAX_LIFETIME_SECONDS:-2592000}
      RRSIG_INCEPTION_FUTURE_SECONDS: ${RRSIG_INCEPTION_FUTURE_SECONDS:-300}
      RRSIG_MIN_REMAINING_SECONDS: ${RRSIG_MIN_REMAINING_SECONDS:-0}
      GRACE_DAYS: ${GRACE_DAYS:-90}
      NEGATIVE_CACHE_TTL_SECONDS: ${NEGATIVE_CACHE_TTL_SECONDS:-60}
      MIN_TTL: ${MIN_TTL:-30}
      MAX_TTL: ${MAX_TTL:-86400}
      DS_DIGEST_TYPES: ${DS_DIGEST_TYPES:-2}
      APEXES_PER_PARENT_PER_DAY: ${APEXES_PER_PARENT_PER_DAY:-0}
      DOH_TIMEOUT_SECONDS: ${DOH_TIMEOUT_SECONDS:-5}
      DOH_CD: ${DOH_CD:-1}
      MAINTENANCE_INTERVAL_SECONDS: ${MAINTENANCE_INTERVAL_SECONDS:-300}
      HEALTH_CHECK_DNS: ${HEALTH_CHECK_DNS:-true}
    volumes:
      - zone-data:/data

volumes:
  zone-data:
